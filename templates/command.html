<html lang="en">
<head>
    <title>Ассемблер RISC-V</title>
    <link rel="stylesheet" href="/static/styles/universal.css">
    <link rel="stylesheet" href="/static/styles/command_style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
</head>

<header>
        <div class="header_rectangle">
          <a href="/commands"><img class="logo_image" src="http://127.0.0.1:9000/rvimg/logo.png" alt="logo"></a>
        </div>
</header>

<div class="contents_container">
    <div id="card" class="card">
      <img src=" {{.command.CardImage}} " class="card_image">
      <p class="col_name_text rectangle">Название команды</p>
      <p class="col_content_text">{{ .command.ComName }}</p>
      <p class="col_name_text rectangle">Формат</p>
      <p class="col_content_text">{{ .command.Fmt }}</p>
      <p class="col_name_text rectangle">№ регистра rs</p>
      <p class="col_content_text">{{ .command.RsNum }}</p>
      <p class="col_name_text rectangle">№ регистра rd</p>
      <p class="col_content_text">{{ .command.RdNum }}</p>
      <p class="col_name_text rectangle">Описание команды</p>
      <p class="col_content_text">{{ .command.Description }}</p>
    </div>
</div>

</html>
